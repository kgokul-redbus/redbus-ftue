<script>
/* Defaults for this page (Tag and list). The Persuasion tags stores read localStorage when their script loads, so this runs first: it keeps this page's switches in their own
   storage so they never touch the deck's or the other pages', and seeds the default state: Cleanliness & Staff, Women mode and 3D icons off; only Primo, Deals, Ad and Previously booked on. */
(function () {
  var P = 'mob-tag-and-list-v1:', get = Storage.prototype.getItem, set = Storage.prototype.setItem, rem = Storage.prototype.removeItem;
  var mine = function (k) { return typeof k === 'string' && k.indexOf('ptags-') === 0; };
  Storage.prototype.getItem = function (k) { return get.call(this, this === localStorage && mine(k) ? P + k : k); };
  Storage.prototype.setItem = function (k, v) { return set.call(this, this === localStorage && mine(k) ? P + k : k, v); };
  Storage.prototype.removeItem = function (k) { return rem.call(this, this === localStorage && mine(k) ? P + k : k); };
  var ALL = ['seatlock', 'lmb', 'nonstop', 'rtc', 'primo', 'deals', 'via', 'layover', 'book0', 'award', 'ad', 'highlight', 'reward', 'prev'], ON = ['ad', 'prev', 'primo', 'deals'];
  var DEFAULTS = { 'ptags-ugc': 'off', 'ptags-women-v2': 'off', 'ptags-cstar': 'off',
    'ptags-master': JSON.stringify(ALL.reduce(function (o, k) { o[k] = ON.indexOf(k) >= 0; return o; }, {})) };
  window.M_RESET = function () { Object.keys(DEFAULTS).forEach(function (k) { set.call(localStorage, P + k, DEFAULTS[k]); }); };
  window.M_ID = 'tag-and-list'; window.M_OPT = 'L';
  try { Object.keys(DEFAULTS).forEach(function (k) { if (get.call(localStorage, P + k) === null) set.call(localStorage, P + k, DEFAULTS[k]); }); } catch (e) {}
})();
</script>
